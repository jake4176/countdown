<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer</title>
  <meta name="description" content="A simple, beautiful countdown timer and stopwatch.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="logo">⏳ Timer</div>
    <select id="langSelect" class="lang-select" aria-label="Language"></select>
  </header>

  <main class="container">
    <div class="mode-toggle" role="tablist">
      <button id="modeCountdown" class="mode-btn active" role="tab" data-i18n="modeCountdown">Countdown</button>
      <button id="modeStopwatch" class="mode-btn" role="tab" data-i18n="modeStopwatch">Stopwatch</button>
    </div>

    <div class="ring-wrap" id="ringWrap">
      <div class="ring" id="ring"></div>
      <div class="display" id="display" aria-live="polite">25:00</div>
    </div>

    <div id="setupArea" class="setup-area">
      <div class="presets">
        <button class="preset-btn" data-min="5">5</button>
        <button class="preset-btn" data-min="15">15</button>
        <button class="preset-btn" data-min="30">30</button>
        <button class="preset-btn" data-min="60">60</button>
        <span class="preset-unit" data-i18n="minutes">min</span>
      </div>
      <div class="custom-input">
        <span class="custom-label" data-i18n="customInput">Custom</span>
        <label class="num-field">
          <input type="number" id="inputMin" min="0" max="999" placeholder="0">
          <span data-i18n="minutes">min</span>
        </label>
        <label class="num-field">
          <input type="number" id="inputSec" min="0" max="59" placeholder="0">
          <span data-i18n="seconds">sec</span>
        </label>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-primary" data-i18n="start">Start</button>
      <button id="resetBtn" class="btn" data-i18n="reset">Reset</button>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
